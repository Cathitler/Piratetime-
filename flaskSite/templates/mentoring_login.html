<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mentoring Login — Pirate Time</title>
    <link rel="icon" href="sitelogo.jpg" type="image/jpg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg-primary: #0a0a0f;
            --bg-secondary: #111118;
            --bg-card: #16161f;
            --border-subtle: rgba(255,255,255,0.06);
            --border-medium: rgba(255,255,255,0.1);
            --text-primary: #f0f0f5;
            --text-secondary: #b0b0c0;
            --text-muted: #6a6a7a;
            --accent: #e8456b;
            --accent-hover: #f06080;
            --accent-glow: rgba(232,69,107,0.35);
            --radius-sm: 8px;
            --radius-md: 14px;
            --font-family: 'Inter', -apple-system, sans-serif;
        }
        body {
            font-family: var(--font-family);
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-container {
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-md);
            padding: 40px 36px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.6);
        }
        .login-container .logo {
            text-align: center;
            margin-bottom: 24px;
        }
        .login-container .logo img {
            width: 60px;
            height: 60px;
            border-radius: var(--radius-sm);
            object-fit: contain;
        }
        .login-container h1 {
            font-size: 1.5rem;
            font-weight: 700;
            text-align: center;
            margin-bottom: 6px;
        }
        .login-container .subtitle {
            text-align: center;
            color: var(--text-muted);
            font-size: 0.85rem;
            margin-bottom: 24px;
        }
        .login-container label {
            display: block;
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 6px;
        }
        .login-container input[type="password"] {
            width: 100%;
            padding: 10px 14px;
            background: var(--bg-secondary);
            border: 1px solid var(--border-medium);
            border-radius: var(--radius-sm);
            color: var(--text-primary);
            font-size: 1rem;
            font-family: var(--font-family);
            transition: border-color 0.2s;
        }
        .login-container input[type="password"]:focus {
            outline: none;
            border-color: var(--accent);
        }
        .login-container .error {
            color: var(--accent);
            font-size: 0.8rem;
            margin-top: 8px;
            text-align: center;
        }
        .login-container button {
            width: 100%;
            padding: 10px;
            background: var(--accent);
            border: none;
            border-radius: var(--radius-sm);
            color: #fff;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            font-family: var(--font-family);
            margin-top: 16px;
        }
        .login-container button:hover {
            background: var(--accent-hover);
            box-shadow: 0 0 30px var(--accent-glow);
        }
        .login-container .back-link {
            display: block;
            text-align: center;
            margin-top: 16px;
            color: var(--text-muted);
            font-size: 0.8rem;
            text-decoration: none;
            transition: color 0.2s;
        }
        .login-container .back-link:hover {
            color: var(--text-secondary);
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">
            <img src="sitelogo.jpg" alt="Pirate Time">
        </div>
        <h1>🔐 Mentoring Hub</h1>
        <p class="subtitle">Enter the password to access analytics</p>
        <form method="POST">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="Enter password..." required autofocus>
            {% if error %}
            <div class="error">{{ error }}</div>
            {% endif %}
            <button type="submit">Access Dashboard</button>
        </form>
        <a href="/" class="back-link">← Back to Home</a>
    </div>
</body>
</html>
